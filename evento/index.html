  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  opacity:.028;pointer-events:none;z-index:9999}
.num{font-family:'General Sans',sans-serif;font-weight:700;font-feature-settings:"tnum" 1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.ke-wrap{max-width:1200px;margin:0 auto;padding:0 44px 48px}

/* NAV */
.ke-nav{position:sticky;top:0;z-index:100;background:rgba(25,25,25,.94);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--ke-border);padding:0 44px;display:flex;align-items:center;gap:14px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.ke-nav::-webkit-scrollbar{display:none}
.navlogo{padding:12px 16px 12px 0;border-right:1px solid var(--ke-border);display:flex;align-items:center;gap:11px;flex-shrink:0}
.navlogo img{width:30px;height:30px;object-fit:contain}
.navlogo .navsub{font-size:9px;font-weight:700;letter-spacing:.18em;color:var(--ke-muted);text-transform:uppercase}
.cyberbadge{display:flex;align-items:center;flex-shrink:0;padding-left:4px}
.cyberbadge img{height:36px;width:auto;display:block}
.navspace{flex:1}
.tabbar{display:flex;gap:2px;flex-shrink:0}
.tab{font-size:10px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;padding:16px 13px;cursor:pointer;color:var(--ke-muted);border-bottom:2.5px solid transparent;white-space:nowrap;transition:color .15s;background:none;border-top:none;border-left:none;border-right:none;font-family:inherit}
.tab:hover{color:var(--ke-text)}
.tab.on{color:var(--ke-orange);border-bottom-color:var(--ke-orange)}
.live{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:rgba(77,204,128,.07);border:1px solid rgba(77,204,128,.28);font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ke-green);white-space:nowrap;flex-shrink:0}
.live i{width:7px;height:7px;border-radius:50%;background:var(--ke-green);box-shadow:0 0 0 0 rgba(77,204,128,.6);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(77,204,128,.55)}70%{box-shadow:0 0 0 7px rgba(77,204,128,0)}100%{box-shadow:0 0 0 0 rgba(77,204,128,0)}}

/* DAY FILTER */
.dayfilter{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--ke-card);border:1px solid var(--ke-border);border-radius:14px;padding:14px 18px;margin:20px 0 8px;position:sticky;top:52px;z-index:90}
.demochip{margin-left:auto;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ke-warn);background:rgba(255,216,138,.08);border:1px solid rgba(255,216,138,.28);padding:4px 10px;border-radius:999px}
.df-lbl{font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--ke-muted);margin-right:4px}
.df-grp{display:flex;align-items:center;gap:6px}
.df-grp .gl{font-size:8px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,112,10,.55);margin-right:2px}
.df-grp.week .gl{color:rgba(230,230,230,.3)}
.daypill{font-size:11px;font-weight:600;letter-spacing:.03em;padding:7px 13px;border-radius:999px;cursor:pointer;white-space:nowrap;
  background:rgba(230,230,230,.05);border:1px solid var(--ke-border);color:var(--ke-soft);transition:all .15s;font-family:inherit}
.daypill:hover{border-color:rgba(255,112,10,.35);color:var(--ke-text)}
.daypill.on{background:var(--ke-orange);border-color:var(--ke-orange);color:#fff;font-weight:700}
.daypill.future{opacity:.5}
.daypill.today::after{content:'•';color:var(--ke-green);margin-left:5px;font-size:14px;line-height:0}
.daypill.on.today::after{color:#fff}
.df-div{width:1px;height:22px;background:var(--ke-border);flex-shrink:0}

/* PAGE HEAD */
.phead{margin:26px 0 6px}
.eyebrow{font-size:10px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--ke-orange);display:flex;align-items:center;gap:9px;margin-bottom:12px}
.eyebrow::before{content:'';width:20px;height:2px;background:var(--ke-orange);border-radius:999px}
.ptitle{font-family:'Bitroad',sans-serif;font-weight:400;font-size:clamp(30px,4.4vw,52px);line-height:1;color:var(--ke-text);margin-bottom:12px}
.ptitle span{color:var(--ke-orange)}
.pctx{font-size:12px;color:var(--ke-soft);line-height:1.6}
.pctx b{color:var(--ke-text);font-weight:600}
.upd{display:inline-flex;align-items:center;gap:7px;margin-top:12px;padding:6px 13px;border-radius:999px;background:rgba(230,230,230,.05);border:1px solid var(--ke-border);font-size:10px;color:var(--ke-muted);letter-spacing:.04em}
.upd i{width:6px;height:6px;border-radius:50%;background:var(--ke-green);flex-shrink:0}
.upd b{color:var(--ke-soft);font-weight:600;font-variant-numeric:tabular-nums}

/* SECTION HEAD */
.sec{display:flex;align-items:center;gap:11px;margin:38px 0 15px;padding-bottom:10px;border-bottom:1px solid var(--ke-border)}
.sec .l{width:18px;height:2px;background:rgba(255,112,10,.55);border-radius:999px;flex-shrink:0}
.sec .l.r{background:var(--ke-bad)}
.sec .t{font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--ke-muted);flex:1}
.pill{padding:3px 11px;border-radius:999px;font-size:10px;font-weight:600;letter-spacing:.04em;background:rgba(230,230,230,.06);color:var(--ke-soft);border:1px solid var(--ke-border);white-space:nowrap}
.srclogo{height:18px;width:auto;opacity:.9;flex-shrink:0;vertical-align:middle}
.srclogo.ml{height:26px}
.postsel{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 12px;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ke-muted)}
.postsel span{color:var(--ke-orange);margin-right:4px}
.pbtn{font-family:inherit;font-size:11px;font-weight:700;min-width:30px;height:28px;padding:0 8px;border-radius:7px;cursor:pointer;background:rgba(230,230,230,.05);border:1px solid var(--ke-border);color:var(--ke-soft);transition:all .15s}
.pbtn:hover{border-color:rgba(255,112,10,.35);color:var(--ke-text)}
.pbtn.on{background:var(--ke-orange);border-color:var(--ke-orange);color:#fff}

/* CHIPS */
.chip{display:inline-flex;align-items:center;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:4px;border:1px solid;white-space:nowrap}
.c-ok{color:var(--ke-green);background:rgba(77,204,128,.08);border-color:rgba(77,204,128,.3)}
.c-warn{color:var(--ke-warn);background:rgba(255,216,138,.08);border-color:rgba(255,216,138,.3)}
.c-bad{color:var(--ke-bad);background:rgba(224,90,58,.1);border-color:rgba(224,90,58,.3)}
.c-acc{color:var(--ke-orange);background:rgba(255,112,10,.07);border-color:rgba(255,112,10,.25)}
.c-neu{color:var(--ke-muted);background:rgba(255,255,255,.04);border-color:var(--ke-border)}

/* KPI GRID */
.kgrid{display:grid;gap:12px;margin-bottom:12px}
.kg4{grid-template-columns:repeat(4,1fr)} .kg5{grid-template-columns:repeat(5,1fr)} .kg3{grid-template-columns:repeat(3,1fr)} .kg2{grid-template-columns:1fr 1fr}
.kc{background:var(--ke-card);border:1px solid var(--ke-border);border-radius:12px;padding:18px 20px;position:relative;overflow:hidden;min-height:104px}
.kc::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,rgba(255,112,10,.5),rgba(255,112,10,.04))}
.kc .kl{font-size:9px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ke-muted);margin-bottom:10px}
.kc .kv{font-family:'General Sans';font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em;font-size:clamp(22px,2.4vw,28px);line-height:1;color:var(--ke-text)}
.kc .kv.or{color:var(--ke-orange)}
.kc .ks{font-size:11px;color:var(--ke-muted);margin-top:8px;display:flex;align-items:center;gap:6px}
.delta{font-weight:700;font-variant-numeric:tabular-nums}
.delta.up{color:var(--ke-green)} .delta.dn{color:var(--ke-bad)}

/* BIG STAT */
.bigstat{display:flex;align-items:center;gap:22px;background:var(--ke-card);border:1px solid var(--ke-border);border-radius:14px;padding:22px 26px;margin-bottom:12px;position:relative;overflow:hidden}
.bigstat::before{content:'';position:absolute;top:-50%;right:-4%;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(255,112,10,.12),transparent 66%);pointer-events:none}
.bigstat .bv{font-family:'General Sans';font-weight:700;font-variant-numeric:tabular-nums;font-size:46px;line-height:1;color:var(--ke-orange)}
.bigstat .bl{font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--ke-muted);margin-bottom:6px}
.bigstat .bd{font-size:12px;color:var(--ke-soft);line-height:1.6}

/* OBJETIVOS (progress) */
.obj{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.objc{background:var(--ke-card);border:1px solid var(--ke-border);border-radius:12px;padding:18px 20px}
.objc .oh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.objc .on{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ke-soft)}
.objc .op{font-family:'General Sans';font-weight:700;font-variant-numeric:tabular-nums;font-size:22px;color:var(--ke-text)}
.objc .op.ok{color:var(--ke-green)}
.track{height:9px;background:rgba(255,255,255,.05);border-radius:999px;overflow:hidden;position:relative;margin-bottom:9px}
.track>.fill{height:100%;border-radius:999px;background:linear-gradient(90deg,rgba(255,112,10,.85),rgba(255,112,10,.4))}
.track>.ideal{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ke-text);opacity:.55}
.objc .od{font-size:11px;color:var(--ke-muted);display:flex;justify-content:space-between;gap:10px}
.objc .od b{color:var(--ke-soft);font-weight:600}

/* CHART */
.chart{background:var(--ke-card);border:1px solid var(--ke-border);border-radius:14px;padding:20px 22px 16px;margin-bottom:12px}
.chart .ch{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px;flex-wrap:wrap}
.chart .ct{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ke-soft)}
.legend{display:flex;gap:16px;font-size:11px;color:var(--ke-muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:7px}.legend i{width:10px;height:10px;border-radius:3px}
svg.svg{width:100%;height:auto;display:block;overflow:visible}

/* FUNNEL */
.funnel{display:flex;flex-direction:column;gap:7px}
.fstep{display:grid;grid-template-columns:168px 1fr 150px;gap:14px;align-items:center}
.fstep .fn{font-size:12px;color:var(--ke-soft);font-weight:600}
.fstep .fn small{display:block;font-size:10px;color:var(--ke-muted);font-weight:500}
.fbar{height:34px;background:rgba(255,255,255,.03);border-radius:7px;overflow:hidden;position:relative}
.fbar>i{display:block;height:100%;border-radius:7px;background:linear-gradient(90deg,rgba(255,112,10,.8),rgba(255,112,10,.3));display:flex;align-items:center;padding-left:12px}
.fbar>i b{font-family:'General Sans';font-weight:700;font-variant-numeric:tabular-nums;font-size:13px;color:#fff}
.fstep .fr{text-align:right;font-size:11px;color:var(--ke-muted)}
.fstep .fr b{font-family:'General Sans';font-weight:700;font-variant-numeric:tabular-nums;color:var(--ke-text);font-size:14px;display:block}
.fstep .fr .drop{color:var(--ke-bad);font-size:10px}
@media(max-width:620px){.fstep{grid-template-columns:110px 1fr 84px;gap:8px}.fstep .fn{font-size:11px}}

/* MIX / GEO bars */
.bars{display:flex;flex-direction:column;gap:10px}
.brow{display:grid;grid-template-columns:150px 1fr 108px;gap:14px;align-items:center}
.brow .bl{font-size:12px;color:var(--ke-soft);font-weight:600;display:flex;align-items:center;gap:8px}
.brow .bl em{font-style:normal;color:var(--ke-muted);font-size:10px;font-weight:500;margin-left:4px}
.brow .bl i{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.bt{height:19px;background:rgba(255,255,255,.04);border-radius:6px;overflow:hidden}.bt>i{display:block;height:100%;border-radius:6px}
.brow .bv{text-align:right;font-family:'General Sans';font-weight:700;font-variant-numeric:tabular-nums;font-size:13px;color:var(--ke-text)}
.brow .bv small{display:block;color:var(--ke-muted);font-weight:500;font-size:10px}
@media(max-width:560px){.brow{grid-template-columns:116px 1fr 76px;gap:9px}}

/* TABLE */
.blk{background:var(--ke-card);border:1px solid var(--ke-border);border-radius:12px;overflow:hidden;margin-bottom:12px}
.blkh{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--ke-border);background:var(--ke-header)}
.blkt{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ke-muted)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{width:100%;border-collapse:collapse;min-width:680px}
.t thead th{font-size:9px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--ke-muted);padding:11px 14px;text-align:left;border-bottom:1px solid var(--ke-border);background:var(--ke-header);white-space:nowrap}
.t thead th.n{text-align:right}
.t tbody td{padding:11px 14px;border-bottom:1px solid rgba(255,255,255,.035);font-size:13px;vertical-align:middle}
.t td.n{text-align:right;font-family:'General Sans';font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em;font-size:13px;white-space:nowrap}
.t td.n.hi{color:var(--ke-orange)}
.t td.rk{font-family:'Bitroad';color:var(--ke-soft);width:30px}
.t tr.top td.rk{color:var(--ke-orange)}
.t td.nm{color:var(--ke-text);font-weight:600}
.t tbody tr:last-child td{border-bottom:none}
.t tbody tr:hover td{background:rgba(255,255,255,.014)}
.t tfoot td{padding:12px 14px;font-family:'General Sans';font-weight:700;font-variant-numeric:tabular-nums;font-size:13px;background:rgba(230,230,230,.025);border-top:1px solid rgba(230,230,230,.09)}
.t tfoot td.lbl{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ke-muted)}

/* ADS */
.ads{display:flex;flex-direction:column;gap:8px}
.ad{background:var(--ke-card);border:1px solid var(--ke-border);border-radius:12px;padding:16px 18px}
.ad.top{border-color:rgba(255,112,10,.3)}
.adh{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.adn{font-family:'Bitroad';font-size:16px;color:var(--ke-soft);width:34px;height:34px;display:flex;align-items:center;justify-content:center;background:rgba(230,230,230,.05);border:1px solid var(--ke-border);border-radius:8px;flex-shrink:0}
.ad.top .adn{color:var(--ke-orange);background:rgba(255,112,10,.07);border-color:rgba(255,112,10,.2)}
.adt{flex:1;min-width:0}.adt b{font-size:13px;font-weight:600;color:var(--ke-text);display:block}.adt span{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ke-muted)}
.admetrics{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--ke-border);border-radius:8px;overflow:hidden}
.adm{background:var(--ke-card);padding:11px 12px}
.adm .ml{font-size:8.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ke-muted);margin-bottom:5px}
.adm .mv{font-family:'General Sans';font-weight:700;font-variant-numeric:tabular-nums;font-size:15px;color:var(--ke-text)}
.adm .mv.hi{color:var(--ke-orange)}
@media(max-width:720px){.admetrics{grid-template-columns:repeat(3,1fr)}}
.thumb{border-radius:8px;overflow:hidden;display:block;flex-shrink:0;border:1px solid rgba(230,230,230,.12)}
.adh .thumb{border-radius:9px}
.tcell{width:56px;padding:7px 0 7px 14px}.tcell .thumb{border-radius:7px}

/* SPRINT REVIEW */
.corte{background:var(--ke-card);border:1px solid var(--ke-border);border-radius:12px;padding:16px 20px;margin-bottom:8px}
.corte.empty-c{opacity:.55}
.corteh{display:flex;align-items:center;gap:11px;margin-bottom:2px}
.corteh .hh{font-family:'Bitroad';font-size:13px;color:var(--ke-muted);background:rgba(230,230,230,.05);border:1px solid var(--ke-border);border-radius:7px;padding:4px 10px}
.corteh .cortet{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ke-soft)}
.ac-item{padding:13px 16px;background:rgba(255,255,255,.015);border:1px solid var(--ke-border);border-radius:9px;margin-top:9px}
.ac-item .area{display:inline-flex;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ke-orange);background:rgba(255,112,10,.07);border:1px solid rgba(255,112,10,.2);padding:2px 8px;border-radius:4px;margin-bottom:9px}
.ac-item .ln{font-size:12.5px;color:rgba(230,230,230,.66);line-height:1.6;margin-bottom:3px}
.ac-item .ln b{color:var(--ke-text);font-weight:600}
.corte .none{font-size:12px;color:var(--ke-muted);display:flex;align-items:center;gap:8px;padding:5px 0 2px}

/* NOTE / ACCIONABLES */
.note{background:var(--ke-card);border:1px solid var(--ke-border);border-left:2px solid rgba(255,112,10,.5);border-radius:0 10px 10px 0;padding:15px 20px;margin-bottom:10px;display:flex;gap:14px;align-items:flex-start}
.note .ni{font-family:'Bitroad';font-size:13px;color:var(--ke-soft);flex-shrink:0;width:22px;text-align:center}
.note p{font-size:13px;color:rgba(230,230,230,.7);line-height:1.7}.note strong{color:var(--ke-text);font-weight:600}
.acc{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.accc{background:var(--ke-card);border:1px solid var(--ke-border);border-radius:12px;padding:18px 20px}
.accc .at{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ke-orange);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.accc .arow{margin-bottom:11px}.accc .arow:last-child{margin-bottom:0}
.accc .al{font-size:8.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ke-muted);margin-bottom:3px}
.accc .av{font-size:12.5px;color:var(--ke-soft);line-height:1.55}.accc .av b{color:var(--ke-text);font-weight:600}

/* EMPTY STATE */
.empty{background:var(--ke-card);border:1px dashed var(--ke-border);border-radius:14px;padding:46px 30px;text-align:center;margin-bottom:12px}
.empty .ei{font-size:30px;margin-bottom:12px;opacity:.5}
.empty h4{font-family:'Bitroad';font-weight:400;font-size:19px;color:var(--ke-soft);margin-bottom:8px}
.empty p{font-size:12.5px;color:var(--ke-muted);max-width:420px;margin:0 auto;line-height:1.6}

/* SOURCES panel */
.srcs{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--ke-border);border:1px solid var(--ke-border);border-radius:12px;overflow:hidden;margin-bottom:12px}
.src{background:var(--ke-card);padding:14px 16px;display:flex;align-items:center;gap:10px}
.src i{width:7px;height:7px;border-radius:50%;background:var(--ke-green);flex-shrink:0}
.src .sn{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ke-soft);flex:1}
.src .st{font-family:'General Sans';font-weight:700;font-variant-numeric:tabular-nums;font-size:12px;color:var(--ke-text)}
@media(max-width:620px){.srcs{grid-template-columns:1fr 1fr}}

/* FOOTER */
.foot{padding:30px 44px;border-top:1px solid var(--ke-border);display:flex;justify-content:space-between;align-items:center;gap:16px;font-size:10px;color:var(--ke-muted);letter-spacing:.1em;text-transform:uppercase}
.foot b{color:var(--ke-soft);font-weight:600}

.hidden{display:none!important}
@media(max-width:960px){
  .ke-wrap{padding:0 18px 36px}.ke-nav{padding:0 14px}.foot{padding:24px 18px}
  .kg4,.kg5{grid-template-columns:1fr 1fr}.kg3{grid-template-columns:1fr}.obj{grid-template-columns:1fr}.acc{grid-template-columns:1fr}
  .bigstat{flex-direction:column;align-items:flex-start;gap:10px}
}
@media(max-width:700px){
  .ke-nav{flex-wrap:wrap;padding:6px 14px;gap:10px}
  .navspace{display:none}
  .live{margin-left:auto}
  .tabbar{order:5;width:100%;overflow-x:auto;scrollbar-width:none;border-top:1px solid var(--ke-border)}

/* ============ FORMATO ============ */
const nf=(n,d=0)=>Number(n||0).toLocaleString('es-AR',{minimumFractionDigits:d,maximumFractionDigits:d});
function moneyC(v){v=+v||0;const a=Math.abs(v);if(a>=1e6)return '$ '+(v/1e6).toFixed(1).replace('.',',')+'M';if(a>=1e3)return '$ '+(v/1e3).toFixed(1).replace('.',',')+'k';return '$ '+nf(Math.round(v));}
const M=v=>moneyC(v), K=v=>moneyC(v);
const pc=(n,d=1)=>nf(n,d)+'%';
const dlt=(v,inv=false)=>{if(v==null||!isFinite(v))return '<span class="delta">—</span>';const ar=v>0?'▲':'▼';return `<span class="delta ${(inv?v<0:v>0)?'up':'dn'}">${ar} ${nf(Math.abs(v),1)}%</span>`;};
function dpct(cur,prev,inv){if(prev==null||prev===0||!isFinite(prev))return '<span class="delta">—</span> vs período ant.';return dlt((cur-prev)/prev*100,inv)+' vs período ant.';}

/* ============ FECHAS ============ */
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function parseISO(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
function dayDiff(a,b){return Math.round((new Date(b.getFullYear(),b.getMonth(),b.getDate())-new Date(a.getFullYear(),a.getMonth(),a.getDate()))/86400000);}
const DOW=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];

/* ============ FETCH SUPABASE ============ */
async function sb(table,cols,dateCol,from,to){
  let out=[],off=0;const pg=1000;
  for(;;){
    let url=SUPABASE_URL+'/rest/v1/'+table+'?select='+encodeURIComponent(cols)+'&limit='+pg+'&offset='+off;
    if(dateCol&&from) url+='&'+dateCol+'=gte.'+from+'&'+dateCol+'=lte.'+to;
    if(dateCol) url+='&order='+dateCol+'.asc';
    let r; try{ r=await fetch(url,{headers:HDR}); }catch(e){console.warn('[KE] '+table+' fetch error',e);return out;}
    if(!r.ok){console.warn('[KE] '+table+' '+r.status+' — fuente ignorada');return out;}
    const rows=await r.json(); out=out.concat(rows);
    if(rows.length<pg) break; off+=pg;
  }
  return out;
}
const S=(a,f)=>a.reduce((s,x)=>s+(parseFloat(f(x))||0),0);

function titleCase(s){return s.replace(/\w\S*/g,t=>t.charAt(0).toUpperCase()+t.slice(1));}

async function loadData(){
  const today=new Date();
  const fi=parseISO(CFG.fecha_inicio), ff=parseISO(CFG.fecha_fin);
  const endData=addDays(today,0)<ff?today:ff;                // último día con datos posibles
  const S_cur=iso(fi), E_cur=iso(endData);
  const len=dayDiff(fi,endData)+1;
  const pFrom=iso(addDays(fi,-len)), pTo=iso(addDays(fi,-1)); // período anterior comparable
  const tTo=E_cur+'T23:59:59';
  try{
    const [rev,ga4,tn,meta,google,ma,mlo,igPosts,igacc,ins,igSt,gev,gitems]=await Promise.all([
      sb(T('revenue'),'date,source_medium,purchase_revenue,transactions,sessions,total_users,add_to_carts','date',pFrom,E_cur),
      sb(T('ga4_sessions'),'date,source_medium,total_users,sessions,transactions,total_revenue','date',pFrom,E_cur),
      sb(T('tiendanube_orders'),'date,order_payment_status,order_total_paid,order_total_products','date',pFrom,E_cur),
      sb(T('meta_ads'),'date,campaign_name,amount_spent,impressions,reach,frequency,landing_page_views,website_purchases,purchases_conv_value,video_view_3s,ctr,cpm','date',pFrom,E_cur),
      sb(T('google_ads'),'*',   // * : no todos los sellers tienen ctr/search_impression_share; una columna faltante da 400 y se pierde Google entero
      'date',pFrom,E_cur),
      sb(T('mercado_ads'),'fecha,campaign_name,cost,impressions,clicks,total_amount,units_quantity,campaign_acos_target','fecha',pFrom,E_cur),
      sb(T('ml_orders'),'order_date_created,order_status,order_payment_status,order_total_amount,order_total_quantity','order_date_created',pFrom,tTo),
      sb(T('ig_posts_media'),'date_published,media_type,media_product_type,permalink,thumbnail_url,caption,reach,total_interactions,saved,shares,likes,comments,follows_from_post,views','date_published',S_cur,tTo),
      sb(T('ig_account_daily'),'fecha,account_reach,account_views,account_total_interactions,account_shares,account_saves,account_comments','fecha',pFrom,E_cur),
      sb(T('insights'),'semana,area,estatus,accionable,impacto_esperado,resumen,resultado,responsable',null),
      sb(T('ig_stories'),'date_published,media_type,media_product_type,permalink,caption,reach,views,total_interactions,shares,follows','date_published',S_cur,tTo),
      // GA4 detallado (no todos los sellers lo tienen: si la tabla falta da 404 y el funnel cae a revenue/add_to_carts)
      sb(T('ga4_events'),'date,event_name,sessions','date',pFrom,E_cur),
      sb(T('ga4_items'),'date,item_name,items_viewed,items_added_to_cart,items_purchased,item_revenue','date',S_cur,E_cur)
    ]);
    // historias (tabla aparte) como posteos tipo STORY: entran al filtro "Historias" de Social
    const ig=igPosts.concat(igSt.map(s=>({...s,media_product_type:'STORY',saved:0,likes:0,comments:0,follows_from_post:s.follows})));
    // store = revenue (purchase_revenue + add_to_carts) por fecha; si una fecha
    // no tiene revenue cargado (ETL parcial del día en curso), se usa GA4 total_revenue.
    const revByDate={}; rev.forEach(r=>{revByDate[r.date]=(revByDate[r.date]||0)+(parseFloat(r.purchase_revenue)||0);});
    const goodRev=new Set(Object.keys(revByDate).filter(d=>revByDate[d]>0));
    const mapGa4=g=>({date:g.date,source_medium:g.source_medium,purchase_revenue:g.total_revenue,transactions:g.transactions,sessions:g.sessions,total_users:g.total_users,add_to_carts:null});
    const store=rev.filter(r=>goodRev.has(r.date)).concat(ga4.filter(g=>!goodRev.has(g.date)).map(mapGa4));
    const tnPaid=tn.filter(o=>TN_STATUS.includes((o.order_payment_status||'').toLowerCase()));
    const FN_EV=['session_start','view_item','add_to_cart','begin_checkout','purchase'];
    DATA={store,tn:tnPaid,meta,google,ma,mlo:mlo.filter(o=>o.order_payment_status==='approved'),ig,igacc,ins,gev:gev.filter(e=>FN_EV.includes(e.event_name)),gitems};
    DATA._win={S_cur,E_cur,pFrom,pTo,fi,ff,endData,today};
    // facturación real de la tienda (Tiendanube) si hay datos en la ventana del evento; si no, atribución GA4/revenue
    DATA._hasTN = tnPaid.some(o=>{const d=(o.date||'').slice(0,10);return d>=S_cur&&d<=E_cur;});

    // disponibilidad de secciones
    HAS.google = google.length>0;   // sin filas de Google en la ventana: se oculta todo lo de Google (no se muestra en 0)
    HAS.meli = DATA.mlo.length>0 || ma.length>0;
    HAS.social = ig.length>0 || igacc.length>0;
    HAS.sprint = ins.length>0;
    HAS.paidInsights = ins.some(i=>/paid/i.test(i.area||''));
    HAS.consulInsights = ins.some(i=>/consul/i.test(i.area||''));

    buildDays(); buildCtx(); buildRitmo();
    LASTTS = maxDataTs();
    renderNav(); render();
  }catch(e){console.error(e);document.getElementById('content').innerHTML='<div class="empty"><div class="ei">⚠️</div><h4>Error cargando datos</h4><p>'+e.message+'</p></div>';}
}

function between(d,a,b){return d>=a&&d<=b;}
function inWin(rows,col,a,b){return rows.filter(r=>{const d=(r[col]||'').slice(0,10);return d>=a&&d<=b;});}

function buildDays(){
  const {fi,ff,today}=DATA._win; DAYS=[];
  const total=dayDiff(fi,ff)+1;
  for(let i=0;i<total;i++){const d=addDays(fi,i);const dk=iso(d);
    const diff=dayDiff(today,d);
    const avail=diff<0?'full':diff===0?'today':'future';
    DAYS.push({k:dk,dow:DOW[d.getDay()],dm:String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0'),avail});
  }
}

/* ===== head de un set de filas (una fecha o todo el período) ===== */
function headFor(a,b){
  const st=inWin(DATA.store,'date',a,b), mt=inWin(DATA.meta,'date',a,b), gg=inWin(DATA.google,'date',a,b);
  const ma=inWin(DATA.ma,'fecha',a,b), mlo=inWin(DATA.mlo,'order_date_created',a,b), ig=inWin(DATA.ig,'date_published',a,b), iga=inWin(DATA.igacc,'fecha',a,b);
  // tienda: facturación real Tiendanube si hay; si no, atribución GA4/revenue
  const tn=inWin(DATA.tn,'date',a,b);
  const useTN=DATA._hasTN;
  const factTN=S(tn,x=>x.order_total_paid), ordTN=tn.length;
  const factStore=S(st,x=>x.purchase_revenue), ordStore=S(st,x=>x.transactions);
  const fact=useTN?factTN:factStore, ord=useTN?ordTN:ordStore, factSrc=useTN?'Tiendanube':'GA4';
  const ses=S(st,x=>x.sessions), usr=S(st,x=>x.total_users), atc=S(st,x=>x.add_to_carts);
  // meta
  const invMeta=S(mt,x=>x.amount_spent), factMeta=S(mt,x=>x.purchases_conv_value), compMeta=S(mt,x=>x.website_purchases),
        imprMeta=S(mt,x=>x.impressions), lpvMeta=S(mt,x=>x.landing_page_views), v3=S(mt,x=>x.video_view_3s),
        ctrMw=imprMeta?S(mt,x=>(parseFloat(x.ctr)||0)*(parseFloat(x.impressions)||0))/imprMeta:0,
        freqMw=S(mt,x=>x.reach)?S(mt,x=>(parseFloat(x.frequency)||0)*(parseFloat(x.reach)||0))/S(mt,x=>x.reach):0;
  // google
  const invGoogle=S(gg,x=>x.cost), imprG=S(gg,x=>x.impressions);
  let gCl=S(gg,x=>x.clicks); if(!gCl)gCl=gg.reduce((s,x)=>{const c=+x.cost||0,a=+x.avg_cpc||0;return s+(a?c/a:0);},0);
  const ctrGw=imprG?gCl/imprG*100:0;  // google ctr col viene como fracción; lo derivamos de clics/impresiones
  const isGw=S(gg,x=>x.impressions)?S(gg,x=>(parseFloat(x.search_impression_share)||0)*(parseFloat(x.impressions)||0))/imprG:0;
  // facturación atribuida por canal (desde store, por source_medium)
  const gcpc=st.filter(x=>/google\s*\/\s*cpc/i.test(x.source_medium||''));
  const factGoogle=S(gcpc,x=>x.purchase_revenue), ordGoogle=S(gcpc,x=>x.transactions);
  // mercado libre
  const meliFact=S(mlo,x=>x.order_total_amount), meliOrd=mlo.length,
        meliInvAds=S(ma,x=>x.cost), meliFactAds=S(ma,x=>x.total_amount), meliImpr=S(ma,x=>x.impressions), meliClk=S(ma,x=>x.clicks);
  // social
  const alc=S(ig,x=>x.reach)||S(iga,x=>x.account_reach), inter=S(ig,x=>x.total_interactions)||S(iga,x=>x.account_total_interactions),
        saved=S(ig,x=>x.saved), shares=S(ig,x=>x.shares), follows=S(ig,x=>x.follows_from_post), nposts=ig.length;
  // funnel GA4: sesiones que dispararon cada evento de ecommerce
  const ge=inWin(DATA.gev||[],'date',a,b), evS=n=>S(ge.filter(x=>x.event_name===n),x=>x.sessions);
  const fnSes=evS('session_start'), fnView=evS('view_item'), fnAtc=evS('add_to_cart'), fnChk=evS('begin_checkout'), fnBuy=evS('purchase');
  // productos GA4: GA4 reporta por variante 'NOMBRE (COLOR, TALLE)'; se agrupa por producto
  const itBy={}; inWin(DATA.gitems||[],'date',a,b).forEach(x=>{const k=(x.item_name||'').trim().replace(/\s*\([^()]*\)$/,'')||'(sin nombre)';const o=itBy[k]||(itBy[k]={n:k,v:0,c:0,p:0,r:0});
    o.v+=+x.items_viewed||0;o.c+=+x.items_added_to_cart||0;o.p+=+x.items_purchased||0;o.r+=+x.item_revenue||0;});
  const items=Object.values(itBy).filter(o=>o.v||o.p);
  return {
    fact,ord,factSrc,ticket:ord?fact/ord:0,ses,usr,atc,cvr:ses?ord/ses*100:0,
    invMeta,factMeta,cpaMeta:compMeta?invMeta/compMeta:0,acosMeta:factMeta?invMeta/factMeta*100:0,
    cpmMeta:imprMeta?invMeta/imprMeta*1000:0,ctrM:ctrMw,freqM:freqMw,compMeta,imprMeta,lpvMeta,
    hookM:imprMeta?v3/imprMeta*100:0,cvM:lpvMeta?invMeta/lpvMeta:0,crM:lpvMeta?compMeta/lpvMeta*100:0,
    invGoogle,factGoogle,ordGoogle,cpaGoogle:ordGoogle?invGoogle/ordGoogle:0,acosGoogle:factGoogle?invGoogle/factGoogle*100:0,
    cpcGoogle:gCl?invGoogle/gCl:0,imprG,ctrG:ctrGw,isG:isGw,
    inv:invMeta+invGoogle,acos:fact?(invMeta+invGoogle)/fact*100:0,
    meliFact,meliOrd,meliInvAds,meliFactAds,meliRoas:meliInvAds?meliFactAds/meliInvAds:0,meliAcos:meliFactAds?meliInvAds/meliFactAds*100:0,meliImpr,meliClk,
    alc,inter,er:alc?inter/alc*100:0,saved,shares,follows,nposts,
    fnSes,fnView,fnAtc,fnChk,fnBuy,_items:items,
    _rowsMeta:mt,_rowsGoogle:gg,_rowsMa:ma,_rowsIg:ig,_store:st
  };
}

function buildCtx(){
  const {S_cur,E_cur,pFrom,pTo}=DATA._win;
  const all=headFor(S_cur,E_cur), prev=headFor(pFrom,pTo);
  CTX={all:{head:all,prev:prev,label:'Acumulado del evento'}};
  DAYS.forEach(d=>{ if(d.avail!=='future'){ CTX[d.k]={head:headFor(d.k,d.k),label:d.dow+' '+d.dm}; } });
}
function buildRitmo(){
  const {fi,ff,today}=DATA._win;
  const total=dayDiff(fi,ff)+1;
  const fullDone=Math.min(Math.max(dayDiff(fi,today),0),total);           // días completos antes de hoy
  const todayFrac=(today>=fi&&today<=ff)?(today.getHours()+today.getMinutes()/60)/24:0;
  RITMO=Math.min((fullDone+todayFrac)/total,1);
}
function maxDataTs(){
  const ds=DATA.store.map(x=>x.date).filter(Boolean);
  const mx=ds.sort().slice(-1)[0]||'';
  return mx;
}

function dayState(){
  if(state.day==='all') return {...CTX.all.head, deltas:deltasAll(), avail:true, dayLabel:'Todo el evento', k:'all'};
  const d=DAYS.find(x=>x.k===state.day);
  if(!d) return {...CTX.all.head, deltas:deltasAll(), avail:true, dayLabel:'Todo el evento', k:'all'};
  if(d.avail==='future') return {avail:false, future:true, dayLabel:`${d.dow} ${d.dm}`, dm:d.dm, dow:d.dow};
  const c=CTX[state.day]; return {...c.head, deltas:{}, avail:true, today:d.avail==='today', dayLabel:`${d.dow} ${d.dm}`, k:state.day};
}

/* ---- SPRINT REVIEW (insights de Notion, por semana y área) ---- */
function spTab(D){
  const ins=(DATA.ins||[]).slice().sort((a,b)=>String(b.semana).localeCompare(String(a.semana)));
  // agrupar por semana
  const bySem={};ins.forEach(r=>{(bySem[r.semana||'—']=bySem[r.semana||'—']||[]).push(r);});
  const sems=Object.keys(bySem).sort((a,b)=>String(b).localeCompare(String(a))).slice(0,6);
  const body=sems.map(sem=>{
    const items=bySem[sem].filter(r=>txt(r.estatus)||txt(r.accionable)||txt(r.resumen));
    if(!items.length)return '';
    const cards=items.map(it=>`<div class="ac-item"><span class="area">${it.area||'—'}</span>
      ${txt(it.estatus)?`<div class="ln"><b>Estatus.</b> ${clean(it.estatus)}</div>`:''}
      ${txt(it.accionable)?`<div class="ln"><b>Accionable.</b> ${clean(it.accionable)}</div>`:''}
      ${txt(it.impacto_esperado)?`<div class="ln"><b>Impacto esperado.</b> ${clean(it.impacto_esperado)}</div>`:''}
      ${txt(it.resultado)?`<div class="ln"><b>Resultado.</b> ${clean(it.resultado)}</div>`:''}
      ${(!txt(it.estatus)&&txt(it.resumen))?`<div class="ln">${clean(it.resumen)}</div>`:''}</div>`).join('');
    return `<div class="corte"><div class="corteh"><span class="hh">${fmtSem(sem)}</span><span class="cortet">Semana del ${fmtSem(sem)}</span><span class="chip c-acc" style="margin-left:auto">${items.length} registro${items.length>1?'s':''}</span></div>${cards}</div>`;
  }).join('');
  const intro=`<div class="note"><div class="ni">i</div><p>El <strong>sprint review</strong> resume el estatus, los accionables y el impacto esperado por <strong>área</strong> (Paid Media, Consultoría, Email) a lo largo de las últimas semanas. Se alimenta del tablero de Notion del equipo.</p></div>`;
  return intro+(body||'<div class="empty"><p>Sin registros de sprint review.</p></div>');
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function txt(s){return s&&String(s).trim().length>0;}
function clean(s){return String(s).trim().replace(/\n{2,}/g,'<br>').replace(/\n/g,' ');}
function fmtSem(s){if(!s)return '—';const d=parseISO(String(s).slice(0,10));if(isNaN(d))return s;return d.getDate()+'/'+(d.getMonth()+1);}

/* ---- area sprint (dentro de paid/meli) ---- */
function areaSprint(key,areaMatch){
  const re=key==='consul'?/consul/i:/paid/i;
  const items=(DATA.ins||[]).filter(r=>re.test(r.area||'')&&(txt(r.estatus)||txt(r.resumen))).sort((a,b)=>String(b.semana).localeCompare(String(a.semana))).slice(0,2);
  if(!items.length)return '';
  return secH('Sprint review del área · últimas semanas','Accionables')+
  `<div class="acc">${items.map(it=>`<div class="accc"><div class="at">● Semana ${fmtSem(it.semana)}</div>
    ${txt(it.estatus)?`<div class="arow"><div class="al">Estatus</div><div class="av">${clean(it.estatus)}</div></div>`:(txt(it.resumen)?`<div class="arow"><div class="al">Resumen</div><div class="av">${clean(it.resumen)}</div></div>`:'')}
    ${txt(it.accionable)?`<div class="arow"><div class="al">Accionable</div><div class="av">${clean(it.accionable)}</div></div>`:''}
    ${txt(it.impacto_esperado)?`<div class="arow"><div class="al">Impacto esperado</div><div class="av">${clean(it.impacto_esperado)}</div></div>`:''}</div>`).join('')}</div>`;
}

/* ---- SRC bars ---- */
function srcBars(h){
  const store=h._store||[];
  const by={};store.forEach(x=>{const k=(x.source_medium||'(n/d)').trim();by[k]=(by[k]||0)+(+x.total_users||0);});
  let arr=Object.entries(by).map(([k,v])=>({k,v})).sort((a,b)=>b.v-a.v);
  const total=arr.reduce((s,x)=>s+x.v,0)||1;
  const top=arr.slice(0,8);
  return `<div class="blk" style="padding:20px 22px"><div class="bars">${top.map((s,i)=>{const col=i===0?'var(--ke-orange)':`rgba(230,230,230,${0.5-i*0.045})`;const p=s.v/total*100;
    return `<div class="brow"><div class="bl"><i style="background:${col}"></i>${s.k}</div>
    <div class="bt"><i style="width:${p}%;background:${col}"></i></div>
    <div class="bv">${pc(p)}<small>${nf(s.v)} usuarios</small></div></div>`;}).join('')}</div></div>`;
}

/* ============ CHARTS ============ */
function drawCharts(D){const dEl=document.getElementById('daily'); if(dEl) drawDaily(dEl);}
function drawDaily(box){
  const days=DAYS.map(d=>d.k);
  const total=days.length||1;
  const objDay=OBJ.fact?OBJ.fact/total:0;
  const real=days.map(dk=>{const c=CTX[dk];return c?c.head.fact:0;});
  const today=iso(DATA._win.today);
  const sel=state.day==='all'?-1:days.indexOf(state.day);
  const W=980,H=250,pad={l:52,r:12,t:14,b:40},iw=W-pad.l-pad.r,ih=H-pad.t-pad.b;
  const max=Math.max(objDay,...real)*1.15||1,bw=iw/total,bar=bw*0.4,y=v=>pad.t+ih-(v/max)*ih;
  let g='';
  for(let i=0;i<=3;i++){const gy=pad.t+ih-(i/3)*ih,val=max*i/3;
    g+=`<line x1="${pad.l}" y1="${gy}" x2="${W-pad.r}" y2="${gy}" stroke="rgba(230,230,230,.07)"/>`;
    g+=`<text x="${pad.l-8}" y="${gy+3}" text-anchor="end" font-size="9" fill="rgba(230,230,230,.38)" font-family="General Sans">${val>=1e6?('$'+(val/1e6).toFixed(1)+'M'):(val>=1e3?('$'+Math.round(val/1e3)+'k'):0)}</text>`;}
  DAYS.forEach((dd,i)=>{const cx=pad.l+bw*i+bw/2;const fut=dd.avail==='future';
    if(sel===i)g+=`<rect x="${cx-bw/2+3}" y="${pad.t}" width="${bw-6}" height="${ih}" rx="4" fill="rgba(255,112,10,.06)"/>`;
    if(objDay)g+=`<rect x="${cx-bar-3}" y="${y(objDay)}" width="${bar}" height="${pad.t+ih-y(objDay)}" rx="2" fill="rgba(230,230,230,.05)" stroke="rgba(230,230,230,.22)" stroke-width="1"/>`;
    const rv=real[i]||0;
    if(rv>0){const partial=dd.k===today;g+=`<rect x="${cx+3}" y="${y(rv)}" width="${bar}" height="${pad.t+ih-y(rv)}" rx="2" fill="#ff700a" opacity="${partial?.78:1}"/>`;
      if(partial)g+=`<rect x="${cx+3}" y="${y(rv)}" width="${bar}" height="3" fill="rgba(255,255,255,.4)"/>`;}
    const hot=(sel===i)||(sel===-1&&dd.avail==='today');
    g+=`<text x="${cx}" y="${H-20}" text-anchor="middle" font-size="10" fill="${hot?'var(--ke-text)':(fut?'rgba(230,230,230,.3)':'rgba(230,230,230,.5)')}" font-weight="${hot?'700':'400'}" font-family="General Sans">${dd.dow}</text>`;
    g+=`<text x="${cx}" y="${H-8}" text-anchor="middle" font-size="9" fill="rgba(230,230,230,.35)" font-family="General Sans">${dd.dm}</text>`;});
  box.innerHTML=`<svg class="svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Facturación por día">${g}</svg>`;
}
